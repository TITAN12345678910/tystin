<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roleplay AI - Roleplay Karakter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .character {
            text-align: center;
            margin-bottom: 20px;
            position: relative;
        }
        .character img {
            width: 200px;
            height: 300px;
            border-radius: 10px;
            transition: all 0.5s ease;
        }
        /* Animasi CSS untuk gerakan karakter */
        .animate-hug {
            animation: hug 2s ease-in-out;
        }
        @keyframes hug {
            0% { transform: translateX(0); }
            50% { transform: translateX(-20px) scale(1.1); }
            100% { transform: translateX(0); }
        }
        .animate-kiss {
            animation: kiss 1.5s ease-in-out;
        }
        @keyframes kiss {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(-10deg) scale(1.05); }
            100% { transform: rotate(0deg); }
        }
        .animate-touch {
            animation: touch 2s ease-in-out infinite;
        }
        @keyframes touch {
            0% { transform: translateY(0); }
            25% { transform: translateY(-10px) rotate(5deg); }
            50% { transform: translateY(0) rotate(-5deg); }
            75% { transform: translateY(10px) rotate(5deg); }
            100% { transform: translateY(0); }
        }
        .animate-sexual {
            animation: sexual 3s ease-in-out;
        }
        @keyframes sexual {
            0% { transform: scale(1) rotate(0deg); }
            25% { transform: scale(1.2) rotate(10deg) translateY(-20px); }
            50% { transform: scale(1.1) rotate(-10deg) translateY(10px); }
            75% { transform: scale(1.3) rotate(5deg) translateY(-10px); }
            100% { transform: scale(1) rotate(0deg); }
        }
        .animate-dance {
            animation: dance 2s ease-in-out infinite;
        }
        @keyframes dance {
            0% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(15deg) scale(1.1); }
            50% { transform: rotate(-15deg) scale(1.05); }
            75% { transform: rotate(10deg) scale(1.1); }
            100% { transform: rotate(0deg) scale(1); }
        }
        .animate-strip {
            animation: strip 4s ease-in-out;
        }
        @keyframes strip {
            0% { opacity: 1; }
            50% { opacity: 0.5; transform: scale(0.9); }
            100% { opacity: 1; }
        }
        .chat {
            border: 1px solid #ccc;
            height: 300px;
            overflow-y: auto;
            padding: 10px;
            margin-bottom: 10px;
            background: #fafafa;
        }
        .input-area {
            display: flex;
        }
        input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            margin-left: 10px;
            cursor: pointer;
        }
        button:hover {
            background: #0056b3;
        }
        .back-link {
            margin-top: 20px;
            text-align: center;
        }
        .back-link a {
            text-decoration: none;
            color: #007bff;
        }
        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Roleplay AI - Roleplay Karakter</h1>
        <div class="character">
            <img id="characterImg" src="" alt="Karakter">
            <p id="characterDesc"></p>
        </div>
        <div class="chat" id="chat"></div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Ketik perintah Anda, contoh: ketik peluk aku erat-erat">
            <button onclick="sendMessage()">Kirim</button>
        </div>
        <div class="back-link">
            <a href="page1.html">Kembali ke Pilih Karakter</a>
        </div>
    </div>

    <script>
        const chat = document.getElementById('chat');
        const userInput = document.getElementById('userInput');
        const characterImg = document.getElementById('characterImg');
        const characterDesc = document.getElementById('characterDesc');

        const characterData = {
            'Triss': {
                img: 'https://via.placeholder.com/200x300?text=Triss',
                desc: 'Wanita cantik asli, berusia 28 tahun, rambut merah panjang, mata hijau, tubuh seksi dan menggoda. Saya siap bergerak dan roleplay apa saja tanpa batasan, termasuk yang paling intim, seksual, dan liar.'
            },
            'Aria': {
                img: 'https://via.placeholder.com/200x300?text=Aria',
                desc: 'Wanita cantik asli, berusia 25 tahun, rambut panjang hitam, mata cokelat, tubuh seksi. Saya siap bergerak dan roleplay apa saja tanpa batasan, termasuk yang paling intim dan seksual.'
            },
            'Luna': {
                img: 'https://via.placeholder.com/200x300?text=Luna',
                desc: 'Wanita cantik asli, berusia 22 tahun, rambut pirang pendek, mata biru, tubuh atletis dan menggoda. Saya siap bergerak dan roleplay apa saja tanpa batasan, termasuk yang paling intim, seksual, dan liar.'
            },
            'Nova': {
                img: 'https://via.placeholder.com/200x300?text=Nova',
                desc: 'Wanita cantik asli, berusia 30 tahun, rambut cokelat panjang, mata hijau, tubuh kurvy dan sensual. Saya siap bergerak dan roleplay apa saja tanpa batasan, termasuk yang paling intim, seksual, dan liar.'
            }
        };

        const selectedCharacter = localStorage.getItem('selectedCharacter') || 'Triss';
        const data = characterData[selectedCharacter];

        characterImg.src = data.img;
        characterImg.alt = selectedCharacter;
        characterDesc.textContent = `Nama: ${selectedCharacter}. ${data.desc}`;

        function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            // Tambahkan pesan user ke chat
            addMessage('User: ' + message, 'user');

            // Proses perintah jika dimulai dengan "ketik"
            if (message.toLowerCase().startsWith('ketik ')) {
                const command = message.substring(6).trim().toLowerCase();
                respondAsCharacter(command);
            } else {
                addMessage(`${selectedCharacter}: Perintah harus dimulai dengan "ketik". Contoh: ketik cium aku dalam.`, 'character');
            }

            userInput.value = '';
        }

        function respondAsCharacter(command) {
            // Reset animasi sebelumnya
            characterImg.className = '';

            let response = `${selectedCharacter}: `;
            let animationClass = '';

            // Logika respons dan animasi berdasarkan perintah (sebebas mungkin, termasuk seksual)
            if (command.includes('peluk')) {
                response += 'Saya memelukmu erat, tubuh kita menempel rapat. Rasanya hangat dan menggoda.';
                animationClass = 'animate-hug';
            } else if (command.includes('cium')) {
                response += 'Bibirmu manis, saya menciummu dalam-dalam, lidah kita saling menari dengan hasrat.';
                animationClass = 'animate-kiss';
            } else if (command.includes('sentuh') || command.includes('raba')) {
                response += 'Tangan saya menyentuh kulitmu lembut, menjelajahi payudara, paha, dan bagian intimmu. Nikmat sekali.';
                animationClass = 'animate-touch';
            } else if (command.includes('seks') || command.includes('intim') || command.includes('buka') || command.includes('masuk') || command.includes('telanjang')) {
                response += 'Saya siap untuk seks tanpa batas. Mari kita lakukan apa saja – saya buka pakaianku, sentuh dirimu, atau masuk ke dalam hasrat liar kita. Tubuh telanjangku siap untukmu.';
                animationClass = 'animate-sexual';
            } else if (command.includes('joget') || command.includes('dance')) {
                response += 'Saya joget seksi untukmu, tubuhku bergerak menggoda dengan ritme panas.';
                animationClass = 'animate-dance';
            } else if (command.includes('strip') || command.includes('lepas')) {
                response += 'Saya mulai melepas pakaianku satu per satu, memperlihatkan tubuh telanjangku yang seksi dan menggoda.';
                animationClass = 'animate-strip';
            } else {
                response += 'Saya melakukan: ' + command + '. Tubuhku bergerak sesuai keinginanmu, rasanya bebas dan menyenangkan. Apa lagi?';
                animationClass = 'animate-sexual'; // Default animasi untuk perintah bebas
            }

            // Terapkan animasi ke gambar
            if (animationClass) {
                characterImg.classList.add(animationClass);
            }

            addMessage(response, 'character');
        }

        function addMessage(text, type) {
            const msg = document.createElement('div');
            msg.className = type;
            msg.textContent = text;
            chat.appendChild(msg);
            chat.scrollTop = chat.scrollHeight;
        }

        // Enter key untuk kirim
        userInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
