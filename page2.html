<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roleplay AI - Detail Karakter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            text-align: center;
        }
        .character img {
            width: 250px;
            height: 350px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .character h2 {
            margin: 10px 0;
        }
        .character p {
            font-size: 16px;
            color: #666;
            margin-bottom: 20px;
        }
        button {
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #0056b3;
        }
        .back-link {
            margin-top: 20px;
            text-decoration: none;
            color: #007bff;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Detail Karakter</h1>
        <div class="character" id="characterDetail">
            <!-- Konten akan diisi oleh JavaScript -->
        </div>
        <button onclick="startRoleplay()">Mulai Roleplay</button>
        <br>
        <a href="page1.html" class="back-link">Kembali ke Pilih Karakter</a>
    </div>

    <script>
        const characterData = {
            'Triss': {
                img: 'https://via.placeholder.com/250x350?text=Triss',
                desc: 'Wanita cantik asli, berusia 28 tahun, rambut merah panjang, mata hijau, tubuh seksi dan menggoda. Saya siap bergerak dan roleplay apa saja tanpa batasan, termasuk yang paling intim, seksual, dan liar.'
            },
            'Aria': {
                img: 'https://via.placeholder.com/250x350?text=Aria',
                desc: 'Wanita cantik asli, berusia 25 tahun, rambut panjang hitam, mata cokelat, tubuh seksi. Saya siap bergerak dan roleplay apa saja tanpa batasan, termasuk yang paling intim dan seksual.'
            },
            'Luna': {
                img: 'https://via.placeholder.com/250x350?text=Luna',
                desc: 'Wanita cantik asli, berusia 22 tahun, rambut pirang pendek, mata biru, tubuh atletis dan menggoda. Saya siap bergerak dan roleplay apa saja tanpa batasan, termasuk yang paling intim, seksual, dan liar.'
            },
            'Nova': {
                img: 'https://via.placeholder.com/250x350?text=Nova',
                desc: 'Wanita cantik asli, berusia 30 tahun, rambut cokelat panjang, mata hijau, tubuh kurvy dan sensual. Saya siap bergerak dan roleplay apa saja tanpa batasan, termasuk yang paling intim, seksual, dan liar.'
            }
        };

        const selectedCharacter = localStorage.getItem('selectedCharacter') || 'Triss';
        const data = characterData[selectedCharacter];

        document.getElementById('characterDetail').innerHTML = `
            <img src="${data.img}" alt="${selectedCharacter}">
            <h2>${selectedCharacter}</h2>
            <p>${data.desc}</p>
        `;

        function startRoleplay() {
            // Simpan karakter yang dipilih
            localStorage.setItem('selectedCharacter', selectedCharacter);
            // Redirect ke page3.html
            window.location.href = 'page3.html';
        }
    </script>
</body>
</html>
