<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialHub - Bagikan Foto & Video</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-left">
<i class="fab fa-instagram nav-logo" onclick="toggleView()" tabindex="0"></i>
            <span class="nav-title">SocialHub</span>
        </div>
        <div class="nav-search">
            <i class="fas fa-search"></i>
            <input type="text" placeholder="Cari" id="searchInput">
        </div>
        <div class="nav-right">
<i class="fas fa-home nav-icon active" onclick="showFeed()" tabindex="0"></i>
<i class="fas fa-compass nav-icon" onclick="showExplore()" tabindex="0"></i>
<i class="fas fa-plus-square nav-icon" onclick="showUpload()" tabindex="0"></i>
<i class="fas fa-heart nav-icon" tabindex="0"></i>
<i class="fas fa-user nav-icon" onclick="showProfile()" tabindex="0"></i>
        </div>
    </nav>

<!-- Auth Modal -->
<div id="authModal" class="modal">
    <div class="modal-content auth-modal">
        <div class="auth-header">
            <h2>SocialHub</h2>
            <span class="close" onclick="closeAuth()">&times;</span>
        </div>
        <div class="auth-tabs">
            <button class="tab-btn active" onclick="switchTab('register')">Daftar</button>
            <button class="tab-btn" onclick="switchTab('login')">Masuk</button>
        </div>
        <form id="authForm">
            <div id="registerTab" class="auth-tab active">
                <input type="text" id="regUsername" placeholder="Username" required>
                <input type="email" id="regEmail" placeholder="Email" required>
                <input type="password" id="regPassword" placeholder="Password" required>
                <input type="file" id="avatarInput" accept="image/*" style="display:none;">
<div class="avatar-preview" onclick="document.getElementById('avatarInput').click()" tabindex="0"></div>
                    <i class="fas fa-camera"></i>
                    <p>Pilih foto profil</p>
                </div>
<div id="avatarPreview" style="display:none; width:100%; height:80px; background-size:cover; border-radius:12px; margin:10px 0;"></div>
                <button type="submit">Daftar</button>
            </div>
            <div id="loginTab" class="auth-tab">
                <input type="text" id="loginUsername" placeholder="Username or Email" required>
                <input type="password" id="loginPassword" placeholder="Password" required>
                <button type="submit">Masuk</button>
            </div>
        </form>
    </div>
</div>

<!-- Main Content -->
<main class="main-content">
        <!-- Feed View (Default) -->
        <div id="feedView" class="view active">
            <div class="toggle-buttons">
                <button class="toggle-btn active" onclick="setView('grid')"><i class="fas fa-th"></i> Grid</button>
                <button class="toggle-btn" onclick="setView('reel')"><i class="fas fa-mobile-alt"></i> Reels</button>
            </div>
            <div id="postsGrid" class="posts-grid"></div>
            <div id="postsReel" class="posts-reel"></div>
        </div>

        <!-- Upload Modal -->
        <div id="uploadModal" class="modal">
            <div class="modal-content">
                <div class="upload-header">
                    <h2>Buat Post Baru</h2>
                    <span class="close" onclick="closeUpload()">&times;</span>
                </div>
                <form id="uploadForm">
<div class="upload-preview" id="uploadPreview" tabindex="0"></div>
                        <i class="fas fa-cloud-upload-alt"></i>
                        <p>Pilih foto atau video</p>
                    </div>
                    <input type="file" id="mediaInput" accept="image/*,video/*" style="display: none;">
                    <textarea id="captionInput" placeholder="Tulis caption..."></textarea>
                    <div class="upload-actions">
                        <button type="button" onclick="closeUpload()">Batal</button>
                        <button type="submit">Bagikan</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Explore View -->
        <div id="exploreView" class="view">
            <h2>Explore</h2>
            <div class="toggle-buttons" style="display: none;">
                <button class="toggle-btn active" onclick="setView('grid')"><i class="fas fa-th"></i> Grid</button>
                <button class="toggle-btn" onclick="setView('reel')"><i class="fas fa-mobile-alt"></i> Reels</button>
            </div>
            <div id="postsGrid-explore" class="posts-grid"></div>
            <div id="postsReel-explore" class="posts-reel"></div>
        </div>
        <!-- Profile View -->
        <div id="profileView" class="view">
            <h2>Profil - Posts Kamu (<span id="userPostCount">0</span>)</h2>
            <div class="toggle-buttons" style="display: none;">
                <button class="toggle-btn active" onclick="setView('grid')"><i class="fas fa-th"></i> Grid</button>
                <button class="toggle-btn" onclick="setView('reel')"><i class="fas fa-mobile-alt"></i> Reels</button>
            </div>
            <div id="postsGrid-profile" class="posts-grid"></div>
            <div id="postsReel-profile" class="posts-reel"></div>
        </div>

        <!-- Comment Modal -->
        <div id="commentModal" class="modal">
            <div class="modal-content comment-modal">
                <div class="comment-header">
                    <h3>Komentar</h3>
                    <span class="close" onclick="closeCommentModal()">&times;</span>
                </div>
                <div id="commentsList" class="comments-list"></div>
                <div class="comment-input-box">
                    <input type="text" id="commentInput" placeholder="Tambah komentar...">
                    <button onclick="addComment()" class="comment-submit-btn">Kirim</button>
                </div>
            </div>
        </div>

    </main>

<script src="keyboard.js"></script>
    <script src="script.js"></script>
</body>
</html>
